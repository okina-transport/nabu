server.port=10001

spring.activemq.broker-url=vm://localhost?jms.useAsyncSend=true&broker.persistent=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=legacy
#spring.jpa.hibernate.use-new-id-generator-mappings=true

# Mandatory keycloak params (not used)
keycloak.realm=rutebanken
keycloak.auth-server-url=http://127.0.0.1:8080/auth
keycloak.resource=Nabu
iam.keycloak.client.secret=secret

spring.mail.host=smtp.gmail.com

org.quartz.jobStore.driverDelegateClass = org.quartz.impl.jdbcjobstore.StdJDBCDelegate

notification.email.max.length=5

rutebanken.kubernetes.enabled=false
new.user.email.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:/test-migration
spring.jpa.database=POSTGRESQL
spring.datasource.url=jdbc:tc:postgis:15-3.5-alpine:///baba
spring.datasource.username=baba
spring.datasource.password=baba
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

logging.level.org=INFO

oauth2-issuer=http://localhost:800/auth/
oauth2-client-id=nabu
# OIDC Configuration
com.c4-soft.springaddons.oidc.ops[0].iss=${oauth2-issuer}
com.c4-soft.springaddons.oidc.ops[0].username-claim=preferred_username

# Authorities Configuration
com.c4-soft.springaddons.oidc.ops[0].authorities[0].prefix=ROLE_
com.c4-soft.springaddons.oidc.ops[0].authorities[1].path=$.resource_access.${oauth2-client-id}.roles

# Resource Server Configuration
com.c4-soft.springaddons.oidc.resourceserver.permit-all[0]=/**